openapi: 3.1.0
info:
  title: QuickServe Service API
  description: API for managing orders, products, and customers in the QuickServe microservice
  version: 1.0.0
  contact:
    name: CubeOneBiz
    url: https://cubeonebiz.com
servers:
  - url: /api/v2/quickserve
    description: QuickServe API v2
  - url: /api/v1/quickserve
    description: QuickServe API v1 (Legacy)
paths:
  /health:
    get:
      summary: Health check endpoint
      description: Returns the health status of the QuickServe service
      operationId: healthCheck
      tags:
        - Health
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: quickserve-service
                  version:
                    type: string
                    example: 12.0
                  timestamp:
                    type: string
                    format: date-time
                    example: 2023-05-17T12:00:00Z
  /orders:
    get:
      summary: Get all orders
      description: Returns a list of all orders with optional filtering
      operationId: getOrders
      tags:
        - Orders
      parameters:
        - name: order_status
          in: query
          description: Filter by order status
          schema:
            type: string
        - name: delivery_status
          in: query
          description: Filter by delivery status
          schema:
            type: string
        - name: order_menu
          in: query
          description: Filter by order menu
          schema:
            type: string
        - name: from_date
          in: query
          description: Filter by order date (from)
          schema:
            type: string
            format: date
        - name: to_date
          in: query
          description: Filter by order date (to)
          schema:
            type: string
            format: date
        - name: per_page
          in: query
          description: Number of items per page
          schema:
            type: integer
            default: 15
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: A list of orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation successful
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
    post:
      summary: Create a new order
      description: Creates a new order with the provided data
      operationId: createOrder
      tags:
        - Orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
      responses:
        '200':
          description: Order created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Order created successfully
                  data:
                    $ref: '#/components/schemas/Order'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
  /orders/{id}:
    get:
      summary: Get order by ID
      description: Returns a single order by ID
      operationId: getOrderById
      tags:
        - Orders
      parameters:
        - name: id
          in: path
          description: Order ID
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Order found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation successful
                  data:
                    $ref: '#/components/schemas/Order'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update order
      description: Updates an existing order
      operationId: updateOrder
      tags:
        - Orders
      parameters:
        - name: id
          in: path
          description: Order ID
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderUpdate'
      responses:
        '200':
          description: Order updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Order updated successfully
                  data:
                    $ref: '#/components/schemas/Order'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
    delete:
      summary: Delete order
      description: Deletes an existing order
      operationId: deleteOrder
      tags:
        - Orders
      parameters:
        - name: id
          in: path
          description: Order ID
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Order deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Order deleted successfully
                  data:
                    type: null
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /config:
