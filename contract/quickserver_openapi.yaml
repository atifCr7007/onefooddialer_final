            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
    delete:
      summary: Delete backorder
      description: Deletes an existing backorder
      operationId: deleteBackorder
      tags:
        - Backorders
      parameters:
        - name: id
          in: path
          description: Backorder ID
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Backorder deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Backorder deleted successfully
                  data:
                    type: null
        '404':
          description: Backorder not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /backorders/{id}/complete:
    put:
      summary: Complete a backorder
      description: Marks a backorder as completed
      operationId: completeBackorder
      tags:
        - Backorders
      parameters:
        - name: id
          in: path
          description: Backorder ID
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Backorder completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Backorder completed successfully
                  data:
                    $ref: '#/components/schemas/Backorder'
        '404':
          description: Backorder not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /backorders/{id}/cancel:
    put:
      summary: Cancel a backorder
      description: Marks a backorder as cancelled
      operationId: cancelBackorder
      tags:
        - Backorders
      parameters:
        - name: id
          in: path
          description: Backorder ID
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Backorder cancelled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Backorder cancelled successfully
                  data:
                    $ref: '#/components/schemas/Backorder'
        '404':
          description: Backorder not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

