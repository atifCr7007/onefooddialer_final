version: '3.8'

services:
  # Admin Microservice Mock - Port 4010
  prism-admin:
    image: stoplight/prism:latest
    container_name: prism-admin
    command: mock -h 0.0.0.0 -p 4010 -d /contracts/admin_openapi.yaml
    ports:
      - "4010:4010"
    volumes:
      - ./:/contracts
    networks:
      - prism-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4010"]
      interval: 10s
      timeout: 5s
      retries: 3

